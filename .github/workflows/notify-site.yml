name: Notify site

# WHEN THIS RUNS
#
# Whenever a release here is published, edited or deleted — not on a draft
# being saved, not on a tag being pushed.
#
# `edited` and `deleted` are included because the site's script does not add
# releases to the changelog one at a time: it regenerates the whole page from
# the API on every run. So a correction to an old release's notes is picked up
# just as readily as a new release — but only when something asks it to run.
# Without these two events, fixing a typo in the 1.6 notes would sit unpublished
# until the next scheduled run.
#
# WHY IT EXISTS
#
# The website's changelog page is generated from this repository's releases by
# a workflow in the site repo. That workflow runs on a schedule, which means a
# new release can take up to a day to appear on the site.
#
# This closes that gap. When a release goes out, this sends a signal to the
# site repo, which regenerates the changelog immediately.
#
# It is not load-bearing. If the token expires or this fails, the scheduled run
# picks the release up within a day and nothing is lost. That is why the
# failure is allowed to be quiet.

on:
  workflow_dispatch:

  release:
    types: [published, edited, deleted]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Tell the site the releases have changed
        env:
          # A personal access token with permission to write to the SITE
          # repository. The automatic GITHUB_TOKEN cannot be used here: it is
          # scoped to this repository only, and this job needs to reach across
          # to another one.
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "No SITE_DISPATCH_TOKEN set — skipping."
            echo "The site's scheduled run will pick this change up within a day."
            exit 0
          fi

          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Undisclosed0369/undisclosed0369.app/dispatches \
            -d '{"event_type":"release-published"}' \
            --fail-with-body

          echo "Site notified."
